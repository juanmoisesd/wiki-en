<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Experience v11 | El Cosmos de la Conciencia</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;400;700&family=Playfair+Display:ital,wght@1,400;1,700&display=swap');

        :root {
            --c-bg: #03040a;
            --c-accent: #00d2ff;
            --c-accent-alt: #7000ff;
            --c-text: #f0f4f8;
            --f-main: 'Plus Jakarta Sans', sans-serif;
            --f-accent: 'Playfair Display', serif;
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background: var(--c-bg);
            color: var(--c-text);
            font-family: var(--f-main);
            overflow: hidden;
            user-select: none;
        }

        #experience-layer {
            position: relative;
            width: 100vw; height: 100vh;
            overflow: hidden;
        }

        canvas {
            position: absolute; top: 0; left: 0;
            mix-blend-mode: screen;
        }

        /* Cinematic Background */
        .bg-gradient {
            position: absolute; width: 100%; height: 100%;
            background:
                radial-gradient(circle at 50% 50%, #0a0d25 0%, transparent 70%),
                radial-gradient(circle at 80% 20%, #050714 0%, transparent 50%),
                radial-gradient(circle at 20% 80%, #080a1f 0%, transparent 50%);
            z-index: -2;
        }

        .brain-silhouette {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 80vh; height: 80vh;
            background: url('https://raw.githubusercontent.com/juanmoisesd/juanmoisesd.github.io/main/assets/images/research-logo.svg') no-repeat center center;
            background-size: contain;
            opacity: 0.03;
            filter: blur(2px) invert(1);
            z-index: -1;
            pointer-events: none;
        }

        /* HUD Overlay */
        .hud {
            position: absolute;
            padding: 40px;
            pointer-events: none;
            z-index: 10;
        }

        .hud-top-left { top: 0; left: 0; }
        .hud-bottom-right { bottom: 0; right: 0; text-align: right; }

        .title-block h1 {
            font-family: var(--f-accent);
            font-size: 3rem;
            margin: 0;
            font-style: italic;
            background: linear-gradient(to right, #fff, var(--c-accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
        }

        .title-block p {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 5px;
            opacity: 0.4;
            margin-top: 10px;
        }

        /* Interactive Elements */
        .thought-ui {
            position: absolute;
            bottom: 40px;
            left: 40px;
            pointer-events: auto;
        }

        .btn-mode {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 24px;
            border-radius: 40px;
            color: #fff;
            font-size: 0.7rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            backdrop-filter: blur(10px);
        }

        .btn-mode:hover {
            background: var(--c-accent);
            border-color: var(--c-accent);
            color: var(--c-bg);
            box-shadow: 0 0 30px rgba(0, 210, 255, 0.4);
            transform: translateY(-2px);
        }

        .btn-mode.active {
            background: var(--c-accent-alt);
            border-color: var(--c-accent-alt);
            box-shadow: 0 0 30px rgba(112, 0, 255, 0.4);
        }

        /* Stats display */
        .stats-hud {
            font-family: var(--f-main);
            font-size: 0.6rem;
            opacity: 0.3;
            letter-spacing: 1px;
            margin-bottom: 20px;
        }

        .stats-hud span { color: var(--c-accent); margin-right: 15px; }

        #interaction-guide {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            font-size: 0.6rem;
            opacity: 0.2;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .title-block h1 { font-size: 1.8rem; }
            .hud { padding: 20px; }
        }
    </style>
</head>
<body>

    <div id="experience-layer">
        <div class="bg-gradient"></div>
        <div class="brain-silhouette"></div>

        <canvas id="mainCanvas"></canvas>
        <canvas id="bloomCanvas"></canvas>

        <div class="hud hud-top-left">
            <div class="title-block">
                <h1>Neural Nexus</h1>
                <p>Exploración Sináptica Inmersiva</p>
            </div>
        </div>

        <div class="hud hud-bottom-right">
            <div class="stats-hud">
                SYNS: <span id="stat-nodes">0</span>
                COGN: <span id="stat-activity">0%</span>
            </div>
            <div style="font-family: var(--f-accent); font-style: italic; opacity: 0.5;">
                Dr. Juan Moisés de la Serna
            </div>
        </div>

        <div class="thought-ui">
            <button class="btn-mode" id="btn-stimulate">Liberar Pulso de Pensamiento</button>
        </div>

        <div id="interaction-guide">Navega por la red con el ratón · Haz clic para crear conciencia</div>
    </div>

    <script>
        /**
         * Neural Experience v11 - Cinematic Engine
         * Focus: Aesthetics, Motion, and Emotional Impact
         */

        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        const bloomCanvas = document.getElementById('bloomCanvas');
        const btx = bloomCanvas.getContext('2d');

        let width, height;
        let nodes = [];
        let pulses = [];
        let mouse = { x: -1000, y: -1000, down: false };
        let frameCount = 0;
        let currentMode = 'nebula';

        const config = {
            nodeCount: 65,
            connectionDist: 180,
            repulsion: 1.2,
            colors: {
                primary: '#00d2ff',
                secondary: '#7000ff',
                pulse: '#ffffff',
                bg: '#03040a'
            }
        };

        class Node {
            constructor(x, y) {
                this.x = x || Math.random() * width;
                this.y = y || Math.random() * height;
                this.originX = this.x;
                this.originY = this.y;

                this.vx = (Math.random() - 0.5) * 0.4;
                this.vy = (Math.random() - 0.5) * 0.4;

                this.radius = 1 + Math.random() * 2;
                this.color = Math.random() > 0.5 ? config.colors.primary : config.colors.secondary;
                this.glow = 5 + Math.random() * 10;

                this.noiseOffset = Math.random() * 1000;
                this.activity = 0;
                this.connections = [];
            }

            update() {
                // Organic Floating Motion (Brownian-ish)
                this.vx += (Math.random() - 0.5) * 0.05;
                this.vy += (Math.random() - 0.5) * 0.05;

                // Mouse Interaction
                const dx = mouse.x - this.x;
                const dy = mouse.y - this.y;
                const dist = Math.sqrt(dx*dx + dy*dy);

                if (dist < 200) {
                    const angle = Math.atan2(dy, dx);
                    const force = (200 - dist) / 200;

                    // Interaction: Repel or Vortex
                    this.vx -= Math.cos(angle) * force * 0.2;
                    this.vy -= Math.sin(angle) * force * 0.2;

                    this.activity = Math.max(this.activity, force);
                }

                // Smooth activity decay
                this.activity *= 0.96;

                // Physics Apply
                this.vx *= 0.97;
                this.vy *= 0.97;
                this.x += this.vx;
                this.y += this.vy;

                // Screen Wrap with fade
                if (this.x < 0) this.x = width;
                if (this.x > width) this.x = 0;
                if (this.y < 0) this.y = height;
                if (this.y > height) this.y = 0;
            }

            draw() {
                const alpha = 0.3 + this.activity * 0.7;

                ctx.save();
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius + this.activity * 2, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.globalAlpha = alpha;
                ctx.fill();

                // Inner core
                if (this.activity > 0.1) {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius * 0.5, 0, Math.PI * 2);
                    ctx.fillStyle = '#fff';
                    ctx.fill();
                }
                ctx.restore();
            }
        }

        class Pulse {
            constructor(source, target) {
                this.source = source;
                this.target = target;
                this.progress = 0;
                this.speed = 0.01 + Math.random() * 0.02;
                this.id = Math.random();
            }

            update() {
                this.progress += this.speed;
                if (this.progress >= 1) {
                    this.target.activity = 1.0;
                    return false;
                }
                return true;
            }

            draw() {
                const x = this.source.x + (this.target.x - this.source.x) * this.progress;
                const y = this.source.y + (this.target.y - this.source.y) * this.progress;

                const alpha = Math.sin(this.progress * Math.PI);

                btx.save();
                btx.shadowBlur = 15;
                btx.shadowColor = config.colors.primary;
                btx.fillStyle = '#fff';
                btx.globalAlpha = alpha;
                btx.beginPath();
                btx.arc(x, y, 1.5, 0, Math.PI * 2);
                btx.fill();
                btx.restore();
            }
        }

        function init() {
            width = canvas.width = bloomCanvas.width = window.innerWidth;
            height = canvas.height = bloomCanvas.height = window.innerHeight;

            nodes = [];
            for (let i = 0; i < config.nodeCount; i++) {
                nodes.push(new Node());
            }

            // Build Initial Structure
            updateConnections();

            document.getElementById('stat-nodes').innerText = nodes.length;
        }

        function updateConnections() {
            nodes.forEach(n => {
                n.connections = [];
                nodes.forEach(m => {
                    if (n === m) return;
                    const d = Math.sqrt((n.x-m.x)**2 + (n.y-m.y)**2);
                    if (d < config.connectionDist) {
                        n.connections.push(m);
                    }
                });
            });
        }

        function drawConnections() {
            ctx.save();
            ctx.lineWidth = 0.6;
            for (let i = 0; i < nodes.length; i++) {
                const n = nodes[i];
                for (let j = 0; j < n.connections.length; j++) {
                    const m = n.connections[j];
                    const dist = Math.sqrt((n.x-m.x)**2 + (n.y-m.y)**2);
                    const alpha = Math.max(0, (1 - dist / config.connectionDist) * 0.15);

                    const grad = ctx.createLinearGradient(n.x, n.y, m.x, m.y);
                    grad.addColorStop(0, n.color);
                    grad.addColorStop(1, m.color);

                    ctx.strokeStyle = grad;
                    ctx.globalAlpha = alpha + (n.activity + m.activity) * 0.2;
                    ctx.beginPath();
                    ctx.moveTo(n.x, n.y);
                    ctx.lineTo(m.x, m.y);
                    ctx.stroke();
                }
            }
            ctx.restore();
        }

        function triggerGlobalPulse() {
            const startNode = nodes[Math.floor(Math.random() * nodes.length)];
            startNode.activity = 1.0;

            nodes.forEach(n => {
                if (Math.random() > 0.9) {
                    const target = n.connections[Math.floor(Math.random() * n.connections.length)];
                    if (target) pulses.push(new Pulse(n, target));
                }
            });
        }

        function animate() {
            frameCount++;
            ctx.clearRect(0, 0, width, height);
            btx.clearRect(0, 0, width, height);

            // Dynamic activity calculation for HUD
            let totalActivity = 0;

            nodes.forEach(node => {
                node.update();
                node.draw();
                totalActivity += node.activity;
            });

            drawConnections();

            pulses = pulses.filter(p => {
                p.draw();
                return p.update();
            });

            // HUD Activity Update
            if (frameCount % 10 === 0) {
                const actPct = Math.min(100, Math.round((totalActivity / nodes.length) * 400));
                document.getElementById('stat-activity').innerText = actPct + "%";
            }

            // Occasional Spontaneous Activity
            if (frameCount % 60 === 0 && Math.random() > 0.7) {
                const n = nodes[Math.floor(Math.random() * nodes.length)];
                if (n && n.connections.length > 0) {
                    pulses.push(new Pulse(n, n.connections[0]));
                }
            }

            // Periodic connection re-evaluation for dynamic structure
            if (frameCount % 120 === 0) updateConnections();

            requestAnimationFrame(animate);
        }

        // Interaction
        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        window.addEventListener('mousedown', (e) => {
            const clickNode = new Node(e.clientX, e.clientY);
            clickNode.activity = 1.0;
            nodes.push(clickNode);
            if (nodes.length > 120) nodes.shift();

            updateConnections();

            // Send pulses from nearby nodes
            nodes.forEach(n => {
                const d = Math.sqrt((n.x-e.clientX)**2 + (n.y-e.clientY)**2);
                if (d < 150) {
                    pulses.push(new Pulse(n, clickNode));
                }
            });
        });

        document.getElementById('btn-stimulate').addEventListener('click', (e) => {
            e.stopPropagation();
            triggerGlobalPulse();

            const btn = e.target;
            btn.innerText = "Pensamiento Liberado";
            btn.classList.add('active');
            setTimeout(() => {
                btn.innerText = "Liberar Pulso de Pensamiento";
                btn.classList.remove('active');
            }, 1000);
        });

        window.addEventListener('resize', init);

        init();
        animate();
    </script>
</body>
</html>
