<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Desigualdad Económica | Laboratorio de Economía Emergente</title>
    <!-- SEO y Metadatos Académicos -->
    <meta name="description" content="Simulación interactiva de la evolución de la riqueza y la desigualdad económica basada en agentes.">
    <meta name="author" content="Juan Moisés de la Serna Tuya">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0066cc;
            --primary-glow: rgba(0, 102, 204, 0.15);
            --secondary: #6e5494;
            --accent: #00d1b2;
            --text: #2c3e50;
            --text-muted: #7f8c8d;
            --bg: #ffffff;
            --bg-alt: #f8fafc;
            --border: #e2e8f0;
            --card-bg: #ffffff;
            --nav-bg: #1a202c;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.12);
            --shadow-md: 0 4px 20px rgba(0,0,0,0.08);
            --shadow-lg: 0 10px 30px rgba(0,0,0,0.1);
            --radius: 12px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);

            /* Colores Desigualdad */
            --poverty: #e74c3c;
            --low-income: #e67e22;
            --middle-class: #f1c40f;
            --high-income: #2ecc71;
            --wealthy: #3498db;
        }

        [data-theme="dark"] {
            --text: #f1f5f9;
            --text-muted: #94a3b8;
            --bg: #0f172a;
            --bg-alt: #1e293b;
            --border: #334155;
            --card-bg: #1e293b;
            --nav-bg: #020617;
            --primary: #38bdf8;
        }

        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            transition: var(--transition);
        }

        /* Header */
        .app-header {
            background: var(--nav-bg);
            color: white;
            padding: 0.75rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 100;
        }
        .header-content { display: flex; width: 100%; justify-content: space-between; align-items: center; }
        .app-header h1 { margin: 0; font-size: 1.2rem; font-weight: 800; letter-spacing: -0.025em; }
        .header-stats { display: flex; gap: 1.5rem; font-family: 'JetBrains Mono', monospace; font-size: 0.9rem; }
        .header-actions { display: flex; gap: 0.75rem; }

        /* Layout */
        .app-layout {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        .simulation-view {
            flex: 1;
            background: var(--bg-alt);
            position: relative;
            overflow: hidden;
            cursor: crosshair;
        }
        canvas { display: block; }
        #simCanvas { width: 100%; height: 100%; }

        .sidebar {
            width: 350px;
            background: var(--bg);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow-lg);
            z-index: 50;
        }

        /* Tabs */
        .tabs { display: flex; border-bottom: 1px solid var(--border); }
        .tab-btn {
            flex: 1;
            padding: 1rem;
            border: none;
            background: none;
            color: var(--text-muted);
            cursor: pointer;
            font-weight: 600;
            transition: var(--transition);
        }
        .tab-btn.active { color: var(--primary); border-bottom: 2px solid var(--primary); }

        .tab-content { flex: 1; overflow-y: auto; padding: 1.5rem; }
        .hidden { display: none !important; }

        /* Controles */
        .control-group { margin-bottom: 1.5rem; }
        .control-group label { display: block; margin-bottom: 0.5rem; font-weight: 600; font-size: 0.85rem; }
        .control-group input[type="range"] { width: 100%; accent-color: var(--primary); }
        .control-info { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--text-muted); margin-top: 0.25rem; }

        /* Stats */
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 2rem; }
        .stat-card { background: var(--bg-alt); padding: 1rem; border-radius: 8px; border: 1px solid var(--border); }
        .stat-label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; font-weight: 700; }
        .stat-value { font-size: 1.1rem; font-weight: 800; color: var(--primary); font-family: 'JetBrains Mono', monospace; }

        .mini-charts canvas {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: 1rem;
            width: 100%;
            height: 150px;
        }

        /* Buttons */
        .btn {
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            font-size: 0.85rem;
            transition: var(--transition);
        }
        .btn-primary { background: var(--primary); color: white; border: none; }
        .btn:hover { transform: translateY(-1px); box-shadow: var(--shadow-sm); }

        .btn-small { padding: 0.25rem 0.5rem; font-size: 0.7rem; }

        /* Detail Card */
        .detail-card {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 280px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.5rem;
            box-shadow: var(--shadow-lg);
            z-index: 10;
        }
        [data-theme="dark"] .detail-card { background: rgba(30, 41, 59, 0.9); }

        /* Modal */
        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-content {
            background: var(--bg);
            padding: 2.5rem;
            border-radius: var(--radius);
            max-width: 800px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
        }
        .close-modal { position: absolute; top: 1rem; right: 1.5rem; font-size: 2rem; cursor: pointer; }

        .sidebar-footer { padding: 1rem; border-top: 1px solid var(--border); display: flex; gap: 0.5rem; justify-content: center; }

        /* Comparison Mode */
        .split-view { display: flex; width: 100%; height: 100%; }
        .split-pane { flex: 1; position: relative; border-right: 1px solid var(--border); }

        /* Mobile Adjustments */
        @media (max-width: 900px) {
            .app-layout { flex-direction: column; }
            .sidebar { width: 100%; height: 40%; }
        }
    </style>
</head>
<body>
    <header class="app-header">
        <div class="header-content">
            <h1>Simulador de Desigualdad Económica</h1>
            <div class="header-stats">
                <span id="global-timer">Mes: 0</span>
                <span id="global-gini">Gini: 0.00</span>
            </div>
            <div class="header-actions">
                <button id="btn-compare" class="btn">Comparar Economías</button>
                <button id="btn-edu" class="btn btn-primary">Explicar la Desigualdad</button>
            </div>
        </div>
    </header>

    <main class="app-layout">
        <div id="simulation-container" class="simulation-view">
            <div id="single-view" style="width:100%; height:100%;">
                <canvas id="simCanvas"></canvas>
            </div>
            <div id="comparison-view" class="split-view hidden">
                <div class="split-pane">
                    <div style="position:absolute; top:10px; left:10px; background:rgba(0,0,0,0.6); color:white; padding:2px 8px; border-radius:4px; font-size:0.7rem;">Sdad. A (Actual)</div>
                    <canvas id="simCanvasA"></canvas>
                </div>
                <div class="split-pane">
                    <div style="position:absolute; top:10px; left:10px; background:rgba(0,0,0,0.6); color:white; padding:2px 8px; border-radius:4px; font-size:0.7rem;">Sdad. B (Libre Mercado)</div>
                    <canvas id="simCanvasB"></canvas>
                </div>
            </div>
            <div id="agent-detail-card" class="detail-card hidden">
                <!-- Se llenará dinámicamente al hacer clic en un agente -->
            </div>
        </div>

        <aside class="sidebar">
            <div class="tabs">
                <button class="tab-btn active" data-tab="controls">Controles</button>
                <button class="tab-btn" data-tab="stats">Estadísticas</button>
            </div>

            <section id="tab-controls" class="tab-content">
                <div class="control-group">
                    <label>Evento Económico</label>
                    <select id="event-selector" class="btn" style="width:100%; text-align:left; margin-bottom: 1rem;">
                        <option value="none">Ninguno</option>
                        <option value="boom">Auge Económico</option>
                        <option value="crisis">Crisis Financiera</option>
                        <option value="pandemic">Pandemia</option>
                    </select>
                </div>
                <div class="control-group">
                    <label>Población</label>
                    <input type="range" id="param-population" min="100" max="5000" value="1000">
                    <div class="control-info"><span id="val-population">1000</span></div>
                </div>
                <div class="control-group">
                    <label>Velocidad Simulación</label>
                    <input type="range" id="param-speed" min="1" max="100" value="10">
                </div>
                <div class="control-group">
                    <label>Impuestos Progresivos (%)</label>
                    <input type="range" id="param-tax" min="0" max="90" value="20">
                    <div class="control-info"><span id="val-tax">20%</span></div>
                </div>
                <div class="control-group">
                    <label>Redistribución / Educación</label>
                    <input type="range" id="param-redist" min="0" max="100" value="30">
                    <div class="control-info"><span id="val-redist">30%</span></div>
                </div>
                <div class="control-group">
                    <label>Efecto Mateo (Ricos más ricos)</label>
                    <input type="range" id="param-mateo" min="0" max="100" value="50">
                    <div class="control-info"><span id="val-mateo">Moderado</span></div>
                </div>
                <div class="control-group">
                    <label>Herencia (%)</label>
                    <input type="range" id="param-inheritance" min="0" max="100" value="100">
                    <div class="control-info"><span id="val-inheritance">100%</span></div>
                </div>
                <div class="control-group">
                    <label>Volatilidad Mercado</label>
                    <input type="range" id="param-volatility" min="0" max="100" value="20">
                </div>
                <button id="btn-reset" class="btn btn-primary" style="width: 100%;">Reiniciar Simulación</button>
            </section>

            <section id="tab-stats" class="tab-content hidden">
                <div class="stat-grid">
                    <div class="stat-card">
                        <div class="stat-label">Gini</div>
                        <div id="stat-gini" class="stat-value">0.00</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">PIB Total</div>
                        <div id="stat-pib" class="stat-value">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Pobreza</div>
                        <div id="stat-poverty" class="stat-value">0%</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Millonarios</div>
                        <div id="stat-rich" class="stat-value">0</div>
                    </div>
                </div>
                <div class="mini-charts">
                    <label class="stat-label">Curva de Lorenz</label>
                    <canvas id="lorenzCanvas"></canvas>
                    <label class="stat-label">Histórico Gini</label>
                    <canvas id="giniHistoryCanvas"></canvas>
                    <label class="stat-label">Distribución Riqueza</label>
                    <canvas id="wealthDistCanvas"></canvas>
                </div>
                <div id="stats-detailed" style="font-size: 0.8rem; color: var(--text-muted);">
                    <!-- Top 1%, 10%, etc -->
                </div>
            </section>

            <footer class="sidebar-footer">
                <button id="export-csv" class="btn-small">CSV</button>
                <button id="export-json" class="btn-small">JSON</button>
                <button id="export-png" class="btn-small">PNG</button>
            </footer>
        </aside>
    </main>

    <!-- Modal Educativo -->
    <div id="edu-modal" class="modal hidden">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <div id="edu-text"></div>
        </div>
    </div>

    <script>
        /**
         * Simulador de Desigualdad Económica
         * Autor: Juan Moisés de la Serna Tuya
         *
         * Este script implementa una simulación basada en agentes donde la desigualdad
         * emerge de las interacciones económicas individuales.
         */

        // --- CONFIGURACIÓN Y CONSTANTES ---
        const CONFIG = {
            maxWealth: 1000000,
            baseIncome: 1000,
            avgConsumptionRate: 0.7,
            retirementAge: 65,
            maxAge: 85,
            povertyLine: 500
        };

        // --- MODELO DE AGENTE ---
        class Individual {
            constructor(id, initialWealth = 1000, parent = null) {
                this.id = id;
                this.age = parent ? 0 : Math.floor(Math.random() * 45) + 18;
                this.wealth = initialWealth;
                this.education = parent ? Math.max(0, Math.min(1, parent.education + (Math.random() - 0.5) * 0.2)) : Math.random();
                this.productivity = 0.5 + Math.random() * 0.5;
                this.professionMultiplier = parent ? Math.max(0.5, parent.professionMultiplier * (0.8 + Math.random() * 0.4)) : (0.5 + Math.random() * 2);
                this.isRetired = false;
                this.history = [];

                // Atributos adicionales requeridos
                this.savingsRate = 0.1 + Math.random() * 0.3;
                this.riskTolerance = Math.random();
                this.income = 0;
                this.inheritanceReceived = initialWealth > 2000 ? initialWealth : 0;

                // Atributos visuales
                this.x = Math.random();
                this.y = Math.random();
                this.targetX = this.x;
                this.targetY = this.y;
                this.color = "";
            }

            step(economy) {
                if (this.age > CONFIG.maxAge) {
                    this.die(economy);
                    return;
                }

                this.age += 1/12; // Un mes
                if (this.age >= CONFIG.retirementAge) this.isRetired = true;

                // 1. Ingresos
                let income = 0;
                if (!this.isRetired) {
                    // Ingreso basado en educación, productividad y suerte
                    income = CONFIG.baseIncome * this.professionMultiplier * (0.5 + this.education) * this.productivity;
                    income *= (0.9 + Math.random() * 0.2); // Pequeña variabilidad
                } else {
                    // Pensión (simplificada como % del ahorro previo o transferencia estatal)
                    income = CONFIG.baseIncome * 0.4;
                }
                this.income = income; // Fix: Update property for stats/export

                // 2. Rentabilidad de Inversiones (Efecto Mateo)
                const investmentRate = economy.params.mateo / 1000; // Factor de capitalización
                this.investmentGain = this.wealth * investmentRate * (1 + (Math.random() - 0.5) * (economy.params.volatility / 50));

                // 3. Impuestos (Progresivos)
                let tax = 0;
                const taxRate = economy.params.tax / 100;
                if (income > CONFIG.baseIncome * 2) {
                    tax = (income - CONFIG.baseIncome * 2) * taxRate;
                }

                // 4. Consumo
                const consumption = Math.min(this.wealth + income, CONFIG.baseIncome * 0.8 + (income * CONFIG.avgConsumptionRate));

                // 5. Actualizar Patrimonio
                this.wealth += income + this.investmentGain - tax - consumption;
                if (this.wealth < 0) this.wealth = 0;

                // Guardar historia cada año
                if (Math.floor(this.age * 12) % 12 === 0) {
                    this.history.push({ age: Math.floor(this.age), wealth: this.wealth });
                }

                // Redistribución (Educación/Subsidios)
                const subsidy = (economy.totalTaxes / economy.population.length) * (economy.params.redist / 100);
                this.wealth += subsidy;

                // 6. Recaudar Impuestos para el próximo mes
                economy.collectedTaxes += tax;

                // Movimiento visual suave
                if (Math.random() < 0.05) {
                    this.targetX = Math.random();
                    this.targetY = Math.random();
                }
                this.x += (this.targetX - this.x) * 0.01;
                this.y += (this.targetY - this.y) * 0.01;
            }

            die(economy) {
                // Herencia
                const inheritance = this.wealth * (economy.params.inheritance / 100);
                const taxOnInheritance = this.wealth - inheritance;
                economy.collectedTaxes += taxOnInheritance;

                // Repartir herencia a un nuevo individuo (simulando descendencia)
                const index = economy.population.indexOf(this);
                if (index > -1) {
                    economy.population[index] = new Individual(this.id, inheritance, this);
                }
            }
        }

        // --- SISTEMA ECONÓMICO ---
        class Economy {
            constructor() {
                this.population = [];
                this.month = 0;
                this.totalTaxes = 0;
                this.collectedTaxes = 0;
                this.params = {
                    population: 1000,
                    tax: 20,
                    redist: 30,
                    mateo: 50,
                    inheritance: 100,
                    volatility: 20,
                    speed: 10
                };
                this.giniHistory = [];
                this.init();
            }

            init() {
                this.population = [];
                this.month = 0;
                this.giniHistory = [];
                for (let i = 0; i < this.params.population; i++) {
                    this.population.push(new Individual(i, 1000 + Math.random() * 2000));
                }
            }

            updateParamsFromUI() {
                this.params.population = parseInt(document.getElementById('param-population').value);
                this.params.tax = parseInt(document.getElementById('param-tax').value);
                this.params.redist = parseInt(document.getElementById('param-redist').value);
                this.params.mateo = parseInt(document.getElementById('param-mateo').value);
                this.params.inheritance = parseInt(document.getElementById('param-inheritance').value);
                this.params.volatility = parseInt(document.getElementById('param-volatility').value);
                this.params.speed = parseInt(document.getElementById('param-speed').value);

                document.getElementById('val-population').innerText = this.params.population;
                document.getElementById('val-tax').innerText = this.params.tax + "%";
                document.getElementById('val-redist').innerText = this.params.redist + "%";
                document.getElementById('val-inheritance').innerText = this.params.inheritance + "%";

                const mateoLabel = this.params.mateo < 30 ? "Bajo" : this.params.mateo < 70 ? "Moderado" : "Extremo";
                document.getElementById('val-mateo').innerText = mateoLabel;
            }

            step() {
                // La redistribución usa los impuestos recaudados en el ciclo ANTERIOR
                this.totalTaxes = this.collectedTaxes || 0;
                this.collectedTaxes = 0;

                // Aplicar Eventos
                if (activeEvent !== 'none') {
                    eventTicks++;
                    if (activeEvent === 'crisis') this.params.volatility = 80;
                    if (activeEvent === 'boom') this.params.mateo = 90;
                    if (eventTicks > 24) {
                        activeEvent = 'none';
                        eventTicks = 0;
                        document.getElementById('event-selector').value = 'none';
                        this.updateParamsFromUI();
                    }
                }

                this.population.forEach(agent => agent.step(this));
                this.month++;

                if (this.month % 12 === 0) {
                    this.calculateGini();
                }
            }

            calculateGini() {
                const wealths = this.population.map(a => a.wealth).sort((a, b) => a - b);
                const n = wealths.length;
                if (n === 0) return 0;

                let sumNum = 0;
                let sumDen = 0;
                for (let i = 0; i < n; i++) {
                    sumNum += (i + 1) * wealths[i];
                    sumDen += wealths[i];
                }

                const gini = (sumDen === 0) ? 0 : (2 * sumNum) / (n * sumDen) - (n + 1) / n;
                this.giniHistory.push(gini);
                if (this.giniHistory.length > 100) this.giniHistory.shift();
                return gini;
            }

            getStats() {
                const wealths = this.population.map(a => a.wealth).sort((a, b) => a - b);
                const totalWealth = wealths.reduce((a, b) => a + b, 0);
                const avgWealth = totalWealth / wealths.length;
                const povertyCount = wealths.filter(w => w < CONFIG.povertyLine).length;
                const richCount = wealths.filter(w => w > 100000).length;

                return {
                    totalWealth,
                    avgWealth,
                    povertyRate: (povertyCount / wealths.length) * 100,
                    richCount,
                    gini: this.giniHistory[this.giniHistory.length - 1] || 0
                };
            }
        }

        // Instancias
        let economy = new Economy();
        let economyB = null;
        let isComparing = false;
        let activeEvent = 'none';
        let eventTicks = 0;

        // --- UI Y ANIMACIÓN ---
        const canvas = document.getElementById('simCanvas');
        const canvasA = document.getElementById('simCanvasA');
        const canvasB = document.getElementById('simCanvasB');
        const ctx = canvas.getContext('2d');
        const ctxA = canvasA.getContext('2d');
        const ctxB = canvasB.getContext('2d');

        function resize() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
            if (isComparing) {
                canvasA.width = canvasA.parentElement.clientWidth;
                canvasA.height = canvasA.parentElement.clientHeight;
                canvasB.width = canvasB.parentElement.clientWidth;
                canvasB.height = canvasB.parentElement.clientHeight;
            }
        }
        window.addEventListener('resize', resize);
        resize();

        function drawAgent(c, agent, canW, canH) {
            const size = Math.sqrt(agent.wealth) * 0.1 + 2;
            const x = agent.x * canW;
            const y = agent.y * canH;

            // Transición continua de color
            let r, g, b;
            if (agent.wealth < 500) { // Pobreza: Rojo a Naranja
                const t = agent.wealth / 500;
                r = 231 + (230 - 231) * t;
                g = 76 + (126 - 76) * t;
                b = 60 + (34 - 60) * t;
            } else if (agent.wealth < 2000) { // Naranja a Amarillo
                const t = (agent.wealth - 500) / 1500;
                r = 230 + (241 - 230) * t;
                g = 126 + (196 - 126) * t;
                b = 34 + (15 - 34) * t;
            } else if (agent.wealth < 10000) { // Amarillo a Verde
                const t = (agent.wealth - 2000) / 8000;
                r = 241 + (46 - 241) * t;
                g = 196 + (204 - 196) * t;
                b = 15 + (113 - 15) * t;
            } else if (agent.wealth < 50000) { // Verde a Azul
                const t = (agent.wealth - 10000) / 40000;
                r = 46 + (52 - 46) * t;
                g = 204 + (152 - 204) * t;
                b = 113 + (219 - 113) * t;
            } else { // Azul (Multimillonarios)
                r = 52; g = 152; b = 219;
            }

            c.fillStyle = `rgb(${r},${g},${b})`;
            c.beginPath();
            c.arc(x, y, Math.min(size, 30), 0, Math.PI * 2);
            c.fill();
        }

        function draw() {
            if (!isComparing) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                economy.population.forEach(agent => drawAgent(ctx, agent, canvas.width, canvas.height));
                for(let i=0; i<Math.floor(economy.params.speed / 10) + 1; i++) economy.step();
            } else {
                ctxA.clearRect(0, 0, canvasA.width, canvasA.height);
                ctxB.clearRect(0, 0, canvasB.width, canvasB.height);
                economy.population.forEach(agent => drawAgent(ctxA, agent, canvasA.width, canvasA.height));
                economyB.population.forEach(agent => drawAgent(ctxB, agent, canvasB.width, canvasB.height));
                for(let i=0; i<Math.floor(economy.params.speed / 10) + 1; i++) {
                    economy.step();
                    economyB.step();
                }
            }

            updateUI();
            requestAnimationFrame(draw);
        }

        function updateUI() {
            document.getElementById('global-timer').innerText = `Año: ${Math.floor(economy.month / 12)} Mes: ${economy.month % 12}`;
            const stats = economy.getStats();
            document.getElementById('global-gini').innerText = `Gini: ${stats.gini.toFixed(3)}`;

            if (document.getElementById('tab-stats').classList.contains('hidden') === false) {
                document.getElementById('stat-gini').innerText = stats.gini.toFixed(3);
                document.getElementById('stat-pib').innerText = Math.floor(stats.totalWealth).toLocaleString();
                document.getElementById('stat-poverty').innerText = stats.povertyRate.toFixed(1) + "%";
                document.getElementById('stat-rich').innerText = stats.richCount;

                drawLorenzCurve();
                drawGiniHistory();
                drawWealthDistribution();
                updateDetailedStats(stats);
            }
        }

        function updateDetailedStats(stats) {
            const wealths = economy.population.map(a => a.wealth).sort((a, b) => b - a); // Mayor a menor
            const total = stats.totalWealth || 1;

            const top1 = (wealths.slice(0, Math.ceil(wealths.length * 0.01)).reduce((a,b)=>a+b, 0) / total * 100);
            const top5 = (wealths.slice(0, Math.ceil(wealths.length * 0.05)).reduce((a,b)=>a+b, 0) / total * 100);
            const top10 = (wealths.slice(0, Math.ceil(wealths.length * 0.1)).reduce((a,b)=>a+b, 0) / total * 100);
            const top20 = (wealths.slice(0, Math.ceil(wealths.length * 0.2)).reduce((a,b)=>a+b, 0) / total * 100);
            const bottom40 = (wealths.slice(Math.floor(wealths.length * 0.6)).reduce((a,b)=>a+b, 0) / total * 100);
            const bottom50 = (wealths.slice(Math.floor(wealths.length * 0.5)).reduce((a,b)=>a+b, 0) / total * 100);

            const palmaIndex = (bottom40 > 0) ? (top10 / bottom40).toFixed(2) : "∞";

            document.getElementById('stats-detailed').innerHTML = `
                <p>Concentración de la Riqueza:</p>
                <ul style="list-style:none; padding:0; font-family: 'JetBrains Mono', monospace;">
                    <li>Top 1%: <strong>${top1.toFixed(1)}%</strong></li>
                    <li>Top 5%: <strong>${top5.toFixed(1)}%</strong></li>
                    <li>Top 10%: <strong>${top10.toFixed(1)}%</strong></li>
                    <li>Top 20%: <strong>${top20.toFixed(1)}%</strong></li>
                    <li>Bottom 50%: <strong>${bottom50.toFixed(1)}%</strong></li>
                </ul>
                <div style="margin-top:0.5rem; border-top: 1px solid var(--border); padding-top:0.5rem;">
                    <p>Índice de Palma: <strong>${palmaIndex}</strong></p>
                    <p>Mediana: <strong>$${Math.floor(wealths[Math.floor(wealths.length/2)] || 0).toLocaleString()}</strong></p>
                </div>
            `;
        }

        function drawLorenzCurve() {
            const lCanvas = document.getElementById('lorenzCanvas');
            const lCtx = lCanvas.getContext('2d');
            if (lCanvas.width !== lCanvas.clientWidth) {
                lCanvas.width = lCanvas.clientWidth;
                lCanvas.height = lCanvas.clientHeight;
            }
            lCtx.clearRect(0, 0, lCanvas.width, lCanvas.height);

            const wealths = economy.population.map(a => a.wealth).sort((a, b) => a - b);
            const totalWealth = wealths.reduce((a, b) => a + b, 0);
            const n = wealths.length;

            lCtx.strokeStyle = '#ccc';
            lCtx.setLineDash([5, 5]);
            lCtx.beginPath();
            lCtx.moveTo(0, lCanvas.height);
            lCtx.lineTo(lCanvas.width, 0);
            lCtx.stroke();
            lCtx.setLineDash([]);

            lCtx.strokeStyle = '#0066cc';
            lCtx.lineWidth = 2;
            lCtx.beginPath();
            lCtx.moveTo(0, lCanvas.height);

            let cumulativeWealth = 0;
            for (let i = 0; i < n; i++) {
                cumulativeWealth += wealths[i];
                const x = (i / n) * lCanvas.width;
                const y = lCanvas.height - (cumulativeWealth / (totalWealth || 1)) * lCanvas.height;
                lCtx.lineTo(x, y);
            }
            lCtx.stroke();
        }

        function drawGiniHistory() {
            const gCanvas = document.getElementById('giniHistoryCanvas');
            const gCtx = gCanvas.getContext('2d');
            if (gCanvas.width !== gCanvas.clientWidth) {
                gCanvas.width = gCanvas.clientWidth;
                gCanvas.height = gCanvas.clientHeight;
            }
            gCtx.clearRect(0, 0, gCanvas.width, gCanvas.height);

            const history = economy.giniHistory;
            if (history.length < 2) return;

            gCtx.strokeStyle = '#00d1b2';
            gCtx.lineWidth = 2;
            gCtx.beginPath();
            for (let i = 0; i < history.length; i++) {
                const x = (i / (history.length - 1)) * gCanvas.width;
                const y = gCanvas.height - (history[i] * gCanvas.height);
                if (i === 0) gCtx.moveTo(x, y);
                else gCtx.lineTo(x, y);
            }
            gCtx.stroke();
        }

        function drawWealthDistribution() {
            const wCanvas = document.getElementById('wealthDistCanvas');
            const wCtx = wCanvas.getContext('2d');
            if (wCanvas.width !== wCanvas.clientWidth) {
                wCanvas.width = wCanvas.clientWidth;
                wCanvas.height = wCanvas.clientHeight;
            }
            wCtx.clearRect(0, 0, wCanvas.width, wCanvas.height);

            const wealths = economy.population.map(a => a.wealth);
            const bins = 20;
            const maxWealth = Math.max(...wealths, 10000);
            const histogram = new Array(bins).fill(0);

            wealths.forEach(w => {
                const bin = Math.min(bins - 1, Math.floor((w / maxWealth) * bins));
                histogram[bin]++;
            });

            const maxBin = Math.max(...histogram);
            const binWidth = wCanvas.width / bins;

            wCtx.fillStyle = 'var(--secondary)';
            histogram.forEach((count, i) => {
                const h = (count / (maxBin || 1)) * wCanvas.height;
                wCtx.fillRect(i * binWidth, wCanvas.height - h, binWidth - 1, h);
            });
        }

        // Iniciar
        economy.updateParamsFromUI();
        draw();

        // Event Listeners para Tabs
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
                btn.classList.add('active');
                document.getElementById(`tab-${btn.dataset.tab}`).classList.remove('hidden');
            });
        });

        document.getElementById('btn-reset').addEventListener('click', () => {
            economy = new Economy();
            if (isComparing) {
                economyB = new Economy();
                economyB.params.tax = 0;
                economyB.params.redist = 0;
                economyB.params.inheritance = 100;
                economyB.init();
            }
            economy.updateParamsFromUI();
        });

        document.getElementById('btn-compare').addEventListener('click', () => {
            isComparing = !isComparing;
            const single = document.getElementById('single-view');
            const comp = document.getElementById('comparison-view');

            if (isComparing) {
                single.classList.add('hidden');
                comp.classList.remove('hidden');
                document.getElementById('btn-compare').innerText = "Vista Única";
                economyB = new Economy();
                // Configuración "Libre Mercado" para el B
                economyB.params.tax = 0;
                economyB.params.redist = 0;
                economyB.params.inheritance = 100;
                economyB.params.mateo = 80;
                economyB.init();
            } else {
                single.classList.remove('hidden');
                comp.classList.add('hidden');
                document.getElementById('btn-compare').innerText = "Comparar Economías";
            }
            resize();
        });

        // Actualizar parámetros en tiempo real
        document.querySelectorAll('input[type="range"]').forEach(input => {
            input.addEventListener('input', () => economy.updateParamsFromUI());
        });

        document.getElementById('event-selector').addEventListener('change', (e) => {
            activeEvent = e.target.value;
            eventTicks = 0;
        });

        // Didáctica
        const eduModal = document.getElementById('edu-modal');
        const eduText = document.getElementById('edu-text');

        document.getElementById('btn-edu').addEventListener('click', () => {
            eduModal.classList.remove('hidden');
            eduText.innerHTML = `
                <h2 style="color:var(--primary)">Guía: Comprendiendo la Desigualdad</h2>
                <p>Este simulador muestra cómo pequeñas reglas de interacción generan grandes estructuras sociales.</p>

                <h3>1. El Coeficiente de Gini</h3>
                <p>Es una medida de desigualdad que va de 0 a 1.
                <strong>0</strong> significa igualdad perfecta (todos tienen lo mismo) y
                <strong>1</strong> significa desigualdad máxima (una persona tiene todo).</p>

                <h3>2. El Efecto Mateo</h3>
                <p>"Porque al que tiene, le será dado, y tendrá más; pero al que no tiene, aun lo que tiene le será quitado".
                En economía, esto significa que el capital genera más capital. Los ricos pueden invertir y diversificar, mientras que los pobres consumen todo su ingreso en necesidades básicas.</p>

                <h3>3. La Curva de Lorenz</h3>
                <p>Representa la distribución acumulada de la riqueza. Cuanto más se aleja de la diagonal (línea de igualdad), mayor es la concentración de la riqueza en pocas manos.</p>

                <h3>4. Redistribución y Herencia</h3>
                <p>Los impuestos progresivos y la inversión en educación actúan como niveladores, permitiendo mayor movilidad social. Por otro lado, la herencia sin impuestos tiende a perpetuar la desigualdad a lo largo de las generaciones.</p>

                <div style="margin-top:2rem; padding:1rem; background:var(--bg-alt); border-radius:8px;">
                    <strong>Consejo:</strong> Usa el "Modo Comparación" para ver qué pasa si eliminas los impuestos y aumentas el efecto Mateo.
                </div>
            `;
        });

        document.querySelector('.close-modal').addEventListener('click', () => {
            eduModal.classList.add('hidden');
        });

        // Exportación
        document.getElementById('export-csv').addEventListener('click', () => {
            let csv = "ID,Edad,Patrimonio,Educacion,Ingreso\n";
            economy.population.forEach(a => {
                csv += `${a.id},${Math.floor(a.age)},${a.wealth.toFixed(2)},${a.education.toFixed(2)},${a.income.toFixed(2)}\n`;
            });
            download(csv, "simulacion_datos.csv", "text/csv");
        });

        document.getElementById('export-json').addEventListener('click', () => {
            const data = {
                mes: economy.month,
                gini: economy.giniHistory,
                params: economy.params,
                poblacion: economy.population.map(a => ({ id: a.id, w: a.wealth }))
            };
            download(JSON.stringify(data, null, 2), "simulacion_estado.json", "application/json");
        });

        document.getElementById('export-png').addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = 'simulacion_captura.png';
            link.href = canvas.toDataURL();
            link.click();
        });

        function download(content, fileName, contentType) {
            const a = document.createElement("a");
            const file = new Blob([content], { type: contentType });
            a.href = URL.createObjectURL(file);
            a.download = fileName;
            a.click();
        }

        // Interacción con agentes
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const clickX = (e.clientX - rect.left) / canvas.width;
            const clickY = (e.clientY - rect.top) / canvas.height;

            let closest = null;
            let minDist = 0.05;

            economy.population.forEach(agent => {
                const dx = agent.x - clickX;
                const dy = agent.y - clickY;
                const dist = Math.sqrt(dx*dx + dy*dy);
                if (dist < minDist) {
                    minDist = dist;
                    closest = agent;
                }
            });

            if (closest) showAgentDetail(closest);
            else document.getElementById('agent-detail-card').classList.add('hidden');
        });

        function showAgentDetail(agent) {
            const card = document.getElementById('agent-detail-card');
            card.classList.remove('hidden');

            let socialClass = 'Pobreza';
            if (agent.wealth > 50000) socialClass = 'Rico';
            else if (agent.wealth > 10000) socialClass = 'Clase Alta';
            else if (agent.wealth > 2000) socialClass = 'Clase Media';

            const profession = agent.professionMultiplier > 1.5 ? "Especialista" : agent.professionMultiplier > 0.8 ? "Técnico" : "Operario";

            card.innerHTML = `
                <h3 style="margin-top:0; font-size: 1.1rem;">Individuo #${agent.id}</h3>
                <div style="font-size: 0.85rem; line-height: 1.4;">
                    <p><strong>Profesión:</strong> ${profession}</p>
                    <p><strong>Edad:</strong> ${Math.floor(agent.age)} años</p>
                    <p><strong>Patrimonio:</strong> $${Math.floor(agent.wealth).toLocaleString()}</p>
                    <p><strong>Ingresos:</strong> $${Math.floor(agent.income).toLocaleString()}/mes</p>
                    <p><strong>Clase Social:</strong> ${socialClass}</p>
                    <p><strong>Educación:</strong> ${(agent.education * 100).toFixed(0)}%</p>
                </div>
                <hr style="margin: 1rem 0; border: 0; border-top: 1px solid var(--border);">
                <label class="stat-label">Historial de Riqueza</label>
                <canvas id="agentHistoryCanvas" style="width:100%; height:80px; margin-top:0.5rem;"></canvas>
            `;

            // Dibujar mini-gráfico de historia
            const hCanvas = document.getElementById('agentHistoryCanvas');
            const hCtx = hCanvas.getContext('2d');
            hCanvas.width = hCanvas.clientWidth;
            hCanvas.height = hCanvas.clientHeight;

            const history = agent.history.map(h => h.wealth);
            if (history.length > 1) {
                const maxH = Math.max(...history) || 1;
                hCtx.strokeStyle = 'var(--primary)';
                hCtx.lineWidth = 2;
                hCtx.beginPath();
                for (let i = 0; i < history.length; i++) {
                    const x = (i / (history.length - 1)) * hCanvas.width;
                    const y = hCanvas.height - (history[i] / maxH) * hCanvas.height;
                    if (i === 0) hCtx.moveTo(x, y);
                    else hCtx.lineTo(x, y);
                }
                hCtx.stroke();
            }
        }

    </script>
</body>
</html>
